<title>The Floor Party Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Manrope:wght@400;600;700;800&display=swap">
<style>
/* Layout: a game-show stage that works on a phone in your hand and on a TV. 4x4 LED floor, standings rail, duels take over the screen. Single dark look by choice. */
:root{
  --bg:#080a13;
  --panel:#11142a;
  --line:#252a48;
  --fg:#eef0ff;
  --muted:#8e94bd;
  --accent:#ffe14d;
  --good:#3ddc84;
  --warn:#ff9f43;
  --danger:#ff4d6d;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  background-image:radial-gradient(ellipse at 50% -10%,#1b2150 0%,transparent 60%);background-attachment:fixed}
#app{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px;max-width:1240px;margin:0 auto}
button{font:inherit;color:inherit}
input,select{font:inherit;color:var(--fg);background:#0b0e1f;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
h2{font-family:var(--display);font-weight:800;font-size:26px;text-transform:uppercase;letter-spacing:.02em}
h3{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
p{margin:0}
.hint{color:var(--muted);font-size:14px}
.msg{min-height:1.4em;color:var(--warn);font-weight:700}

.btn{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 16px;font-weight:800;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--accent);color:#14110a;border-color:var(--accent)}
.btn.big{font-size:18px;padding:14px 22px;border-radius:14px}
.btn.ghost{background:transparent}
.btn.small{padding:6px 10px;font-size:13px;border-radius:9px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{font-family:var(--display);font-weight:900;font-size:32px;letter-spacing:.04em;line-height:1;text-transform:uppercase}
.brand span{font-weight:600;font-size:14px;letter-spacing:.2em;color:var(--accent);margin-left:8px;vertical-align:middle}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.codechip{font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:.18em;background:#ffe14d1a;color:var(--accent);border:1px solid #ffe14d55;border-radius:10px;padding:4px 12px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.home{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:880px;margin:0 auto}
.home .wide{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
.codeinput{font-family:var(--display);font-weight:900;font-size:34px;letter-spacing:.3em;text-transform:uppercase;text-align:center}
.check{display:flex;gap:10px;align-items:center;font-weight:600}
.steps{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--muted)}
.steps b{color:var(--fg)}
.fatal{max-width:560px;margin:40px auto;text-align:center}

/* lobby */
.lobby{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px;align-items:start}
.bigcode{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.bigcode .c{font-family:var(--display);font-weight:900;font-size:clamp(64px,12vw,120px);line-height:.9;letter-spacing:.14em;color:var(--accent)}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.plist li{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:#ffffff06}
.dot{width:14px;height:14px;border-radius:50%;background:var(--pc);box-shadow:0 0 10px var(--pc)}
.plist .n{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .n small{font-weight:600;color:var(--muted);margin-left:6px}
.settings{display:flex;gap:12px;flex-wrap:wrap}
.settings label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.cgroup{display:flex;flex-direction:column;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#0b0e1f;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);color:#14110a;border-color:var(--accent)}
.chip .rk{font-family:var(--display);font-weight:900;font-size:15px}
.chip.taken{opacity:.45}

/* board */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.boardwrap{display:flex;flex-direction:column;gap:14px;min-width:0}
.status{font-family:var(--display);font-weight:800;font-size:clamp(20px,3vw,30px);text-transform:uppercase;letter-spacing:.02em;line-height:1.1;min-height:2.2em}
.status b{color:var(--pc,var(--accent))}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:7px;width:100%;max-width:640px;aspect-ratio:1;padding:9px;border-radius:18px;
  background:#05060d;box-shadow:inset 0 0 0 1px var(--line),0 30px 80px -30px #000}
.tile{position:relative;border:0;border-radius:10px;background:color-mix(in oklab,var(--pc) 17%,#0b0e1d);box-shadow:inset 0 0 0 2px color-mix(in oklab,var(--pc) 65%,transparent);
  display:flex;flex-direction:column;justify-content:space-between;gap:3px;padding:clamp(5px,1.2vw,12px);min-width:0;overflow:hidden;text-align:left;cursor:default;transition:transform .15s,opacity .15s,box-shadow .15s,background .15s}
.tile .meta{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tile .who{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(14px,3.4vw,30px);line-height:.92;color:var(--pc);overflow-wrap:anywhere}
.tile .cat{font-size:clamp(9px,1.5vw,13px);font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.tile.empty{background:repeating-linear-gradient(45deg,#0a0c17 0 7px,#0d1020 7px 14px);box-shadow:inset 0 0 0 1px #1a1e36}
.tile.mine{box-shadow:inset 0 0 0 3px var(--pc),0 0 26px color-mix(in oklab,var(--pc) 55%,transparent);background:color-mix(in oklab,var(--pc) 30%,#0b0e1d)}
.tile.target{cursor:pointer;animation:pulse 1.1s ease-in-out infinite}
.tile.target:hover{transform:scale(1.03)}
.tile.dim{opacity:.28}
.tile.lit{background:color-mix(in oklab,var(--pc) 55%,#0b0e1d);box-shadow:inset 0 0 0 3px #fff,0 0 34px var(--pc);opacity:1}
.tile.lit .who{color:#fff}
@keyframes pulse{0%,100%{box-shadow:inset 0 0 0 2px color-mix(in oklab,var(--pc) 65%,transparent)}50%{box-shadow:inset 0 0 0 4px #fff,0 0 26px #ffffff70}}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.side{display:flex;flex-direction:column;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.stand,.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.stand li{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 8px;border-radius:8px}
.stand li.pickable{cursor:pointer}
.stand li.pickable:hover{background:#ffffff0a}
.stand li.out{opacity:.35;text-decoration:line-through}
.stand li.now{background:color-mix(in oklab,var(--pc) 22%,transparent)}
.stand .dot{width:12px;height:12px}
.stand .n{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stand .c{font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.log li{font-size:13px;color:var(--muted)}
.log li b{color:var(--fg)}
.log li .w{color:var(--pc);font-weight:800}
.over{background:var(--panel);border:1px solid var(--accent);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.over .big{font-family:var(--display);font-weight:900;font-size:clamp(34px,6vw,64px);line-height:.95;text-transform:uppercase;color:var(--pc)}

/* duel */
.duel{position:fixed;inset:0;z-index:50;background:var(--bg);background-image:radial-gradient(ellipse at 50% 0%,#20275c 0%,transparent 65%);overflow:auto;
  padding:max(14px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:12px}
.dinner{width:100%;max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:12px;flex:1}
.dhead{text-align:center}
.dhead .eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:700}
.dhead h1{font-family:var(--display);font-weight:900;font-size:clamp(30px,6vw,64px);line-height:.95;text-transform:uppercase;color:var(--accent)}
.clocks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pl{border-radius:16px;padding:12px;background:color-mix(in oklab,var(--pc) 10%,var(--panel));box-shadow:inset 0 0 0 2px color-mix(in oklab,var(--pc) 35%,transparent);text-align:center;opacity:.5;transition:opacity .2s,box-shadow .2s;min-width:0}
.pl.on{opacity:1;box-shadow:inset 0 0 0 3px var(--pc),0 0 40px color-mix(in oklab,var(--pc) 45%,transparent)}
.pl .role{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700}
.pl .nm{font-family:var(--display);font-weight:900;font-size:clamp(20px,3vw,34px);text-transform:uppercase;color:var(--pc);line-height:1;overflow-wrap:anywhere}
.pl .clk{font-family:var(--display);font-weight:800;font-size:clamp(46px,9vw,110px);line-height:1;font-variant-numeric:tabular-nums}
.pl .clk.low{color:var(--danger)}
.screen{position:relative;min-height:clamp(150px,30vh,320px);border-radius:16px;background:#000;box-shadow:inset 0 0 0 1px var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:20px}
.screen .clue{font-weight:800;font-size:clamp(24px,4.2vw,50px);line-height:1.15;text-align:center;text-wrap:balance;overflow-wrap:anywhere}
.screen .clue.emoji{font-size:clamp(100px,18vw,220px);line-height:1}
.screen .count{font-family:var(--display);font-weight:900;font-size:clamp(90px,16vw,200px);color:var(--accent)}
.screen .say{font-family:var(--display);font-weight:800;font-size:clamp(24px,4vw,46px);text-transform:uppercase;text-align:center;line-height:1}
.screen .say small{display:block;font-family:var(--body);font-size:15px;text-transform:none;color:var(--muted);font-weight:600;margin-top:10px;line-height:1.4}
.feedback{text-align:center;min-height:1.6em;font-weight:800;font-size:18px}
.feedback.ok{color:var(--good)}
.feedback.bad{color:var(--warn)}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:16px 12px;font-weight:800;font-size:clamp(16px,2.4vw,22px);cursor:pointer;min-height:64px;overflow-wrap:anywhere}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:active:not(:disabled){transform:scale(.98)}
.opt:disabled{opacity:.45;cursor:default}
.passrow{display:flex;justify-content:center}
.waiting{text-align:center;color:var(--muted);font-weight:700;font-size:17px;padding:10px}
.dres{position:fixed;inset:0;z-index:60;background:#080a13ee;display:flex;align-items:center;justify-content:center;padding:20px}
.dres .card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px;max-width:560px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.dres .w{font-family:var(--display);font-weight:900;font-size:clamp(44px,8vw,88px);line-height:.9;text-transform:uppercase;color:var(--pc)}

@media (max-width:900px){
  .lobby,.stage,.home{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .tile .meta{display:none}
  .brand{font-size:26px}
}
@media (prefers-reduced-motion:reduce){
  .tile.target{animation:none;box-shadow:inset 0 0 0 4px #fff}
  *{transition:none!important}
}
.invite{display:flex;gap:8px;width:100%;margin-top:6px}
.invite input{flex:1;min-width:0;font:inherit;font-size:14px;background:#0b0e1e;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
</style>

const COLORS = ["#ff6a4d","#ffc23d","#a6e33a","#2ad4c4","#4c9dff","#a77bff","#ff5fbf","#ff9b3d","#3ddc84","#f2ec6b","#6fe3ff","#c58bff","#ff8fa3","#b6bfe0"];
const CODE_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ";
const CODE_RE = /^[A-Z]{4}$/;
const NOT_LETTERS = /[^A-Za-z]/g;
const MAX_PICKS = 7;
const app = document.getElementById("app");

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function neighbors(i){const r=i>>2,c=i&3,o=[];if(r>0)o.push(i-4);if(r<3)o.push(i+4);if(c>0)o.push(i-1);if(c<3)o.push(i+1);return o}
function label(i){return "ABCD"[i>>2]+((i&3)+1)}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function clone(o){return JSON.parse(JSON.stringify(o))}
function tilesEach(n){return n<=2?7:n===3?4:n===4?3:n<=7?2:1}

/* ---------- state ---------- */
const PEER_PREFIX = "bought-the-floor-v1-";
const PEER_OPTS = {debug:0};
let me={id:null,name:""};
let code=null, R=null, P={}, recvAt=0;
let isHost=false, H=null, lastSeq={}, hostLoop=null;
let peer=null, hostConn=null, retryT=null, dialT=null, dialFails=0;
const conns=new Map();
const ui={fatal:"",msg:"",net:false,loading:false,spinning:false,spinLit:null,spinSeen:undefined,lockQn:null,lastFx:"",myTurnQn:null,busy:false,prefill:"",fresh:false,copied:false};

function lobbyIds(){return Object.keys(P).sort((a,b)=>(P[a].joinedAt||0)-(P[b].joinedAt||0))}
function order(){return R&&R.phase!=="lobby"&&R.players&&R.players.length?R.players:lobbyIds()}
function colorOf(uid){const i=order().indexOf(uid);return COLORS[(i<0?0:i)%COLORS.length]}
function nameOf(uid){return (R&&R.names&&R.names[uid])||(P[uid]&&P[uid].name)||"Player"}
function count(uid,st){st=st||R;return st&&st.tiles?st.tiles.filter(t=>t&&t.o===uid).length:0}
function alive(st){return st.players.filter(u=>count(u,st)>0)}
function targets(st,u){
  const out=new Set(); if(!u||!st||!st.tiles) return out;
  st.tiles.forEach((t,i)=>{if(t&&t.o!==u&&neighbors(i).some(j=>st.tiles[j]&&st.tiles[j].o===u)) out.add(i)});
  return out;
}

/* ---------- sound ---------- */
let ac;
function beep(f=660,d=.12,v=.1,type="square"){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);
    o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}
}

/* ---------- boot ---------- */
function deviceId(){let u=lsGet("floor-uid");if(!u){u="u"+Math.random().toString(36).slice(2,10)+Date.now().toString(36);lsSet("floor-uid",u)}return u}
function hashCode(){const h=(location.hash||"").slice(1).toUpperCase().replace(NOT_LETTERS,"");return CODE_RE.test(h)?h:""}
function setHash(c){try{history.replaceState(null,"",location.pathname+location.search+(c?"#"+c:""))}catch(e){}}
function inviteLink(){return location.origin+location.pathname+location.search+"#"+code}
function boot(){
  me.id=deviceId(); me.name=lsGet("floor-name")||"";
  if(typeof Peer==="undefined"){ui.fatal="The connection library didn’t load. Check your internet connection and reload the page.";render();return}
  const fromLink=hashCode(); const last=lsGet("floor-room");
  if(last&&(!fromLink||fromLink===last)){
    if(lsGet("floor-host-"+last)==="1") resumeHost(last); else connectPlayer(last,false);
    return;
  }
  ui.prefill=fromLink; render();
}
function wake(){try{navigator.wakeLock&&navigator.wakeLock.request("screen").catch(()=>{})}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&code){wake();if(!isHost&&!(hostConn&&hostConn.open))scheduleRedial(200)}});

/* ---------- home ---------- */
function genCode(){let s="";for(let i=0;i<4;i++)s+=CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)];return s}
function myName(){const el=document.getElementById("nm");return ((el&&el.value)||lsGet("floor-name")||me.name||"").trim().slice(0,24)}
function netError(e){
  const t=e&&e.type;
  if(t==="browser-incompatible") return "This browser can’t make direct connections. Try Chrome or Safari.";
  if(t==="network"||t==="server-error"||t==="socket-error"||t==="socket-closed") return "Couldn’t reach the game server. Check your internet connection and try again.";
  return "Something went wrong. Try again.";
}

function createRoom(){
  if(ui.busy) return; const name=myName(); const plays=document.getElementById("plays").checked;
  if(plays&&!name){ui.msg="Type your name first.";render();return}
  if(name){lsSet("floor-name",name);me.name=name}
  ui.busy=true; ui.msg="Creating room…"; render();
  openHost({c:genCode(),saved:null,playName:plays?name:null,attempt:0});
}
function newHostState(c){
  return {v:2,code:c,hostId:me.id,createdAt:Date.now(),phase:"lobby",settings:{secs:30,penalty:3,mode:"one"},lobby:{},
    players:[],names:{},tiles:null,reserve:[],log:[],challenger:null,claim:null,winner:null,duel:null,spin:null,spinSeq:0};
}
function resumeHost(c){
  let saved=null; try{saved=JSON.parse(lsGet("floor-hoststate-"+c)||"null")}catch(e){}
  if(!saved||saved.code!==c){dropRoom(c);ui.msg="";render();return}
  code=c; isHost=true; R=null; ui.loading=true; ui.msg="Reopening your room…"; render();
  openHost({c,saved,playName:null,attempt:0});
}
function dropRoom(c){lsSet("floor-room",null);lsSet("floor-host-"+c,null);lsSet("floor-hoststate-"+c,null)}
function openHost({c,saved,playName,attempt}){
  const p=new Peer(PEER_PREFIX+c,PEER_OPTS); let opened=false;
  p.on("open",()=>{
    opened=true; peer=p; code=c; isHost=true; conns.clear(); lastSeq={};
    lsSet("floor-room",c); lsSet("floor-host-"+c,"1"); setHash(c);
    H=saved||newHostState(c); H.hostId=me.id;
    if(!saved&&playName) H.lobby[me.id]={name:playName,picks:[],joinedAt:Date.now()};
    ui.busy=false; ui.loading=false; ui.msg=""; ui.spinSeen=undefined;
    startHostLoop(); wake(); commit();
  });
  p.on("connection",hostConnection);
  p.on("error",e=>{
    if(opened) return;
    try{p.destroy()}catch(x){}
    if(e.type==="unavailable-id"){
      // after a reload the server can hold our old id for a few seconds
      if(saved){ if(attempt<20) setTimeout(()=>{if(code===c&&isHost)openHost({c,saved,playName,attempt:attempt+1})},3000);
        else{dropRoom(c);code=null;isHost=false;ui.loading=false;ui.msg=`Couldn’t reopen room ${c}. Start a new one.`;render()} }
      else if(attempt<6) openHost({c:genCode(),saved,playName,attempt:attempt+1});
      else{ui.busy=false;ui.msg="Couldn’t find a free room code. Try again.";render()}
      return;
    }
    if(saved&&attempt<20){ui.msg=netError(e)+" Retrying…";render();setTimeout(()=>{if(code===c&&isHost)openHost({c,saved,playName,attempt:attempt+1})},3000);return}
    ui.busy=false; ui.loading=false; if(!saved){code=null;isHost=false}
    ui.msg=netError(e); render();
  });
  p.on("disconnected",()=>{if(peer===p&&!p.destroyed)setTimeout(()=>{try{if(!p.destroyed&&p.disconnected)p.reconnect()}catch(x){}},1500)});
}

function joinRoom(){
  if(ui.busy) return; const name=myName();
  const c=(document.getElementById("cd").value||"").toUpperCase().replace(NOT_LETTERS,"");
  if(!CODE_RE.test(c)){ui.msg="Room codes are 4 letters.";render();return}
  if(!name){ui.msg="Type your name first.";render();return}
  lsSet("floor-name",name); me.name=name;
  connectPlayer(c,true);
}

/* ---------- player connection ---------- */
function connectPlayer(c,fresh){
  code=c; isHost=false; R=null; P={}; ui.loading=true; ui.fresh=fresh; ui.spinSeen=undefined; ui.msg=""; dialFails=0;
  lsSet("floor-room",c); setHash(c); render();
  if(peer&&!peer.destroyed){if(peer.open)dial();return}
  const p=new Peer(PEER_OPTS); peer=p;
  p.on("open",()=>{if(peer===p)dial()});
  p.on("error",e=>{
    if(peer!==p) return;
    if(e.type==="peer-unavailable"){
      if(ui.fresh&&!R){leaveLocal(`No room called ${code}. Check the code on the host’s screen.`);return}
      hostConn=null; scheduleRedial(2500); return;
    }
    if(!p.open&&!R&&ui.fresh){leaveLocal(netError(e));return}
    ui.msg=netError(e)+" Retrying…"; ui.net=true; render();
  });
  p.on("disconnected",()=>{if(peer===p&&!p.destroyed)setTimeout(()=>{try{if(!p.destroyed&&p.disconnected)p.reconnect()}catch(x){}},1500)});
  wake();
}
function dial(){
  if(!code||isHost||!peer||!peer.open) return;
  if(hostConn){const old=hostConn;hostConn=null;try{old.close()}catch(e){}}
  const conn=peer.connect(PEER_PREFIX+code,{reliable:true}); hostConn=conn;
  conn.on("open",()=>{if(hostConn!==conn)return;clearTimeout(dialT);dialFails=0;sendTo(conn,{t:"hello",uid:me.id,name:me.name||lsGet("floor-name")||"Player"})});
  conn.on("data",m=>playerMsg(conn,m));
  conn.on("close",()=>{if(hostConn===conn){hostConn=null;scheduleRedial(1500)}});
  conn.on("error",()=>{});
  clearTimeout(dialT);
  dialT=setTimeout(()=>{if(hostConn===conn&&!conn.open){hostConn=null;try{conn.close()}catch(e){}scheduleRedial(500)}},20000);
}
function scheduleRedial(ms){
  if(!code||isHost) return; clearTimeout(retryT); dialFails++;
  if(R||!ui.fresh||dialFails>=2){ui.msg=!R&&dialFails>=2&&dialFails<=8?"Taking longer than usual. Some Wi-Fi networks block games like this. Try switching to mobile data.":dialFails>8?"Can’t reach the host. Make sure the host’s screen is on and the page is open.":"Reconnecting to the host…";ui.net=true;render()}
  retryT=setTimeout(()=>{if(!code||isHost)return;if(peer&&peer.open)dial();else if(peer&&!peer.destroyed&&peer.disconnected){try{peer.reconnect()}catch(e){}}},ms);
}
function playerMsg(conn,m){
  if(conn!==hostConn||!m||typeof m!=="object") return;
  if(m.t==="state"&&m.s&&typeof m.s==="object"&&Array.isArray(m.s.players)){
    R=m.s; P=R.lobby||{}; recvAt=Date.now(); ui.loading=false; ui.fresh=false; dialFails=0;
    if(ui.net){ui.msg="";ui.net=false}
    onRoomChange(); render();
  }
  else if(m.t==="closed") leaveLocal("The host closed the room.");
  else if(m.t==="kicked") leaveLocal("The host removed you from the room.");
  else if(m.t==="full") leaveLocal("That room is full. 14 players is the maximum.");
}
function sendTo(c,m){try{if(c&&c.open){c.send(m);return true}}catch(e){}return false}

function leaveLocal(msg){
  if(hostLoop){clearInterval(hostLoop);hostLoop=null}
  clearTimeout(retryT); clearTimeout(dialT);
  if(hostConn){const c=hostConn;hostConn=null;try{c.close()}catch(e){}}
  for(const c of conns.values()){try{c.close()}catch(e){}} conns.clear();
  if(peer){const p=peer;peer=null;try{p.destroy()}catch(e){}}
  lsSet("floor-room",null); code=null; R=null; P={}; H=null; isHost=false;
  ui.loading=false; ui.busy=false; ui.net=false; ui.msg=msg||""; setHash(null); render();
}
function leaveRoom(){
  if(hostConn) sendTo(hostConn,{t:"leave",uid:me.id});
  code=null; render(); setTimeout(()=>leaveLocal(""),250);
}
function endRoom(){
  const c=code; for(const conn of conns.values()) sendTo(conn,{t:"closed"});
  dropRoom(c); setTimeout(()=>leaveLocal("Room closed."),250);
}

/* ---------- player actions ---------- */
function act(type,payload){
  const a={seq:Date.now()+Math.random(),type,...payload};
  if(isHost&&H){hostAct(me.id,a);return}
  if(!sendTo(hostConn,{t:"act",uid:me.id,a})){ui.lockQn=null;ui.msg="Not connected to the host. Reconnecting…";ui.net=true;render()}
}
function togglePick(cat){
  const mine=(P[me.id]&&P[me.id].picks)||[]; let next;
  if(mine.includes(cat)) next=mine.filter(c=>c!==cat); else if(mine.length<MAX_PICKS) next=[...mine,cat]; else {ui.msg=`You can pick up to ${MAX_PICKS}. Tap one to remove it first.`;render();return}
  if(isHost&&H){if(H.lobby[me.id]){H.lobby[me.id].picks=next;ui.msg="";commit()}return}
  P={...P,[me.id]:{...P[me.id],picks:next}}; ui.msg=""; render();
  sendTo(hostConn,{t:"picks",uid:me.id,picks:next});
}

/* ---------- host engine (runs only on the device that created the room) ---------- */
function commit(){
  if(!H) return;
  lsSet("floor-hoststate-"+code,JSON.stringify(H));
  R=clone(H); P=R.lobby||{}; recvAt=Date.now();
  const msg={t:"state",s:R};
  for(const c of conns.values()) sendTo(c,msg);
  onRoomChange(); render();
}
function startHostLoop(){ if(!hostLoop) hostLoop=setInterval(hostTick,100) }
function hostConnection(conn){
  conn.on("open",()=>{if(H)sendTo(conn,{t:"state",s:R||clone(H)})});
  conn.on("data",m=>{try{hostMsg(conn,m)}catch(e){}});
  conn.on("close",()=>{if(conn.uid&&conns.get(conn.uid)===conn)conns.delete(conn.uid)});
  conn.on("error",()=>{});
}
function hostMsg(conn,m){
  if(!H||!m||typeof m!=="object") return;
  const uid=typeof m.uid==="string"&&m.uid.length>0&&m.uid.length<=40?m.uid:null; if(!uid||uid===me.id) return;
  if(m.t==="hello"){
    const old=conns.get(uid); if(old&&old!==conn){try{old.close()}catch(e){}}
    conn.uid=uid; conns.set(uid,conn);
    const name=String(m.name||"").trim().slice(0,24)||"Player";
    if(H.phase==="lobby"){
      if(!H.lobby[uid]){
        if(Object.keys(H.lobby).length>=14){sendTo(conn,{t:"full"});conns.delete(uid);return}
        H.lobby[uid]={name,picks:[],joinedAt:Date.now()};
      }else H.lobby[uid].name=name;
      commit();
    }else sendTo(conn,{t:"state",s:R});
    return;
  }
  if(conn.uid!==uid) return;
  if(m.t==="picks"){
    if(H.phase==="lobby"&&H.lobby[uid]&&Array.isArray(m.picks)){
      H.lobby[uid].picks=[...new Set(m.picks.filter(c=>typeof c==="string"&&ALL.includes(c)))].slice(0,MAX_PICKS); commit();
    }
  }else if(m.t==="act"){
    const a=m.a; if(a&&typeof a==="object"&&typeof a.seq==="number"&&a.seq>(lastSeq[uid]||0)){lastSeq[uid]=a.seq;hostAct(uid,a)}
  }else if(m.t==="leave"){
    conns.delete(uid); if(H.phase==="lobby"&&H.lobby[uid]){delete H.lobby[uid];commit()}
  }
}
function side(d,uid){return d.att===uid?"a":d.def===uid?"d":null}
function hostAct(uid,a){
  if(!H) return; const d=H.duel;
  if(a.type==="challenge"){
    if(H.phase==="board"&&!H.claim&&H.challenger===uid&&targets(H,uid).has(a.tile)) hostStartDuel(a.tile);
  }else if(a.type==="answer"){
    if(H.phase==="duel"&&d&&d.state==="live"&&side(d,uid)===d.active&&a.qn===d.qn) hostAnswer(typeof a.pick==="string"?a.pick:null);
  }else if(a.type==="claim"){
    if(H.claim&&H.claim.by===uid&&H.claim.options.includes(a.tile)){H.tiles[a.tile].o=uid;H.claim=null;hostFinishTurn()}
  }
}
function makeQ(cat,i){
  const list=QBANK[cat]; const [clue,ans]=list[i];
  const others=shuffle([...new Set(list.map(x=>x[1]).filter(x=>x!==ans))]).slice(0,3);
  return {clue,options:shuffle([ans,...others])};
}
function hostStart(){
  const L=H.lobby; const ids=Object.keys(L).sort((a,b)=>(L[a].joinedAt||0)-(L[b].joinedAt||0)); const n=ids.length; if(n<2||n>14) return;
  const k=tilesEach(n); const tiles=genBoard(ids,k); const used=new Set(); const per={};
  ids.forEach(u=>{per[u]=[];for(const c of (L[u].picks||[])){if(per[u].length<k&&!used.has(c)&&ALL.includes(c)){per[u].push(c);used.add(c)}}});
  const pool=shuffle(ALL.filter(c=>!used.has(c)));
  ids.forEach(u=>{while(per[u].length<k){per[u].push(pool.pop())}});
  tiles.forEach(t=>{if(t)t.c=per[t.o].shift()});
  const names={}; ids.forEach(u=>names[u]=L[u].name||"Player");
  Object.assign(H,{phase:"board",players:ids,names,tiles,reserve:pool,log:[],challenger:null,claim:null,winner:null,duel:null,spin:null});
  commit();
}
function genBoard(ids,k){
  const T=ids.length*k; let best=null,bestBad=1e9;
  for(let t=0;t<4000&&bestBad>0;t++){
    const start=Math.floor(Math.random()*16); const cells=new Set([start]);
    while(cells.size<T){const fr=[...cells].flatMap(neighbors).filter(j=>!cells.has(j));cells.add(fr[Math.floor(Math.random()*fr.length)])}
    const owners=shuffle(ids.flatMap(u=>Array(k).fill(u)));
    const tiles=Array(16).fill(null); [...cells].forEach((i,x)=>tiles[i]={o:owners[x],c:""});
    let bad=0; tiles.forEach((tl,i)=>{if(tl)neighbors(i).forEach(j=>{if(j>i&&tiles[j]&&tiles[j].o===tl.o)bad++})});
    if(bad<bestBad){bestBad=bad;best=tiles}
  }
  return best;
}
function hostSpin(){
  if(!H||H.phase!=="board"||H.claim||(H.spin&&H.spin.pendingAt)) return;
  const al=alive(H); if(al.length<2) return;
  H.spinSeq=(H.spinSeq||0)+1;
  H.spin={seq:H.spinSeq,target:al[Math.floor(Math.random()*al.length)],cands:shuffle(al.slice()),pendingAt:Date.now()+3200};
  H.challenger=null; commit();
}
function hostPickChallenger(uid){
  if(!H||H.phase!=="board"||H.claim||!alive(H).includes(uid)) return;
  H.challenger=H.challenger===uid?null:uid; if(H.spin) H.spin.pendingAt=0; commit();
}
function hostStartDuel(idx){
  const att=H.challenger, def=H.tiles[idx].o, cat=H.tiles[idx].c;
  const deck=shuffle(QBANK[cat].map((_,i)=>i)); const secs=H.settings.secs;
  H.duel={att,def,idx,cat,deck,pos:0,qn:1,q:makeQ(cat,deck[0]),clock:{a:secs,d:secs},active:"d",state:"countdown",startedAt:Date.now(),turnAt:0,penaltyUntil:0,last:null,winner:null,doneAt:0};
  H.phase="duel"; commit();
}
function settle(d,now){d.clock[d.active]=Math.max(0,d.clock[d.active]-(now-d.turnAt)/1000);d.turnAt=now}
function advance(d){d.pos++;if(d.pos>=d.deck.length){shuffle(d.deck);d.pos=0}d.qn++;d.q=makeQ(d.cat,d.deck[d.pos])}
function hostAnswer(pick){
  const d=H.duel, now=Date.now(); settle(d,now);
  if(d.clock[d.active]<=0){hostTimeout(d,now);return}
  const ans=QBANK[d.cat][d.deck[d.pos]][1];
  if(pick===ans){d.last={ok:true,ans,by:d.active,n:d.qn};d.active=d.active==="a"?"d":"a";advance(d)}
  else{d.last={ok:false,ans,pick:pick||null,by:d.active,n:d.qn};d.state="penalty";d.penaltyUntil=now+H.settings.penalty*1000}
  commit();
}
function hostTimeout(d,now){d.clock[d.active]=0;d.state="done";d.winner=d.active==="a"?"d":"a";d.doneAt=now;commit()}
function hostTick(){
  if(!H) return; const now=Date.now();
  if(H.phase==="duel"&&H.duel){
    const d=H.duel;
    if(d.state==="countdown"){if(now-d.startedAt>=3000){d.state="live";d.turnAt=now;commit()}return}
    if(d.state==="live"||d.state==="penalty"){
      if(d.clock[d.active]-(now-d.turnAt)/1000<=0){settle(d,now);hostTimeout(d,now);return}
      if(d.state==="penalty"&&now>=d.penaltyUntil){settle(d,now);d.state="live";advance(d);commit()}
      return;
    }
    if(d.state==="done"&&now-d.doneAt>=4500) hostApplyResult();
    return;
  }
  if(H.phase==="board"&&H.spin&&H.spin.pendingAt&&now>=H.spin.pendingAt){H.challenger=H.spin.target;H.spin.pendingAt=0;commit()}
}
function hostApplyResult(){
  const d=H.duel; const w=d.winner==="a"?d.att:d.def, l=d.winner==="a"?d.def:d.att;
  H.log.unshift({w,l,cat:d.cat}); if(H.log.length>40) H.log.length=40;
  H.tiles[d.idx].c=H.reserve.shift()||ALL[Math.floor(Math.random()*ALL.length)];
  H.duel=null; H.phase="board"; H.challenger=null;
  if(H.settings.mode==="all"){H.tiles.forEach(t=>{if(t&&t.o===l)t.o=w})}
  else if(d.winner==="a"){H.tiles[d.idx].o=d.att}
  else{
    const opts=neighbors(d.idx).filter(j=>H.tiles[j]&&H.tiles[j].o===d.att);
    if(opts.length===1) H.tiles[opts[0]].o=d.def; else if(opts.length>1) H.claim={by:d.def,from:d.att,options:opts};
  }
  hostFinishTurn();
}
function hostFinishTurn(){
  const owners=new Set(H.tiles.filter(Boolean).map(t=>t.o));
  if(owners.size===1){H.phase="over";H.winner=[...owners][0];H.claim=null;H.challenger=null}
  commit();
}
function hostToLobby(){Object.assign(H,{phase:"lobby",players:[],names:{},tiles:null,reserve:[],log:[],challenger:null,claim:null,winner:null,duel:null,spin:null});commit()}
function hostSetting(k,v){H.settings[k]=v;commit()}
function hostRemove(uid){
  if(!H||!H.lobby[uid]) return; delete H.lobby[uid];
  const c=conns.get(uid); if(c){sendTo(c,{t:"kicked"});conns.delete(uid)}
  commit();
}
async function copyInvite(){
  const link=inviteLink();
  try{if(navigator.share&&matchMedia("(pointer:coarse)").matches){await navigator.share({title:"The Floor",text:`Join my game of The Floor. Room code ${code}`,url:link});return}}catch(e){if(e&&e.name==="AbortError")return}
  try{await navigator.clipboard.writeText(link);ui.copied=true}catch(e){const el=document.getElementById("inv");if(el){el.select();ui.copied=document.execCommand&&document.execCommand("copy")}}
  render(); setTimeout(()=>{ui.copied=false;if(R&&R.phase==="lobby")render()},2000);
}


/* ---------- reacting to room changes ---------- */
function onRoomChange(){
  if(R.spin&&R.spin.seq!==ui.spinSeen){
    if(ui.spinSeen!==undefined&&R.spin.pendingAt) animateSpin(R.spin);
    ui.spinSeen=R.spin.seq;
  }else if(ui.spinSeen===undefined) ui.spinSeen=R.spin?R.spin.seq:null;
  const d=R.duel;
  if(d){
    const fx=d.last?d.last.n+":"+d.last.ok:"";
    if(fx&&fx!==ui.lastFx){ui.lastFx=fx; d.last.ok?beep(990,.08,.07,"sine"):beep(200,.18,.08)}
    const mySide=side(d,me.id);
    if(mySide&&d.active===mySide&&d.state==="live"&&ui.myTurnQn!==d.qn){ui.myTurnQn=d.qn;beep(760,.05,.05,"sine")}
    if(d.state==="done"&&ui.doneBeep!==d.doneAt){ui.doneBeep=d.doneAt;beep(180,.5,.12,"sawtooth")}
  }
  if(R.phase==="over"&&ui.overBeep!==R.winner){ui.overBeep=R.winner;beep(660,.2);setTimeout(()=>beep(880,.2),200);setTimeout(()=>beep(1320,.5),400)}
}
function animateSpin(sp){
  ui.spinning=true; let k=0,steps=18,delay=55; const c=sp.cands;
  const step=()=>{
    ui.spinLit=steps===0?sp.target:c[(k++)%c.length]; paintSpin();
    if(steps===0){beep(880,.3,.1);setTimeout(()=>{ui.spinning=false;render()},700);return}
    beep(300+steps*20,.04,.05); steps--; delay*=1.09; setTimeout(step,delay);
  };
  step();
}
function paintSpin(){
  app.querySelectorAll(".tile[data-i]").forEach(el=>{const t=R&&R.tiles&&R.tiles[+el.dataset.i];if(!t)return;
    el.classList.toggle("lit",t.o===ui.spinLit);el.classList.toggle("dim",t.o!==ui.spinLit)});
}

/* ---------- render ---------- */

function render(){

}

function renderLobby(){
  const ids=lobbyIds(); const n=ids.length; const k=tilesEach(Math.max(2,n));
  const mine=(P[me.id]&&P[me.id].picks)||[];
  const taken=new Set(ids.filter(u=>u!==me.id).flatMap(u=>(P[u].picks||[]).slice(0,k)));
  app.innerHTML=header(`<span class="codechip">${esc(code)}</span>
    ${isHost?`<button class="btn ghost small" id="end">Close room</button>`:`<button class="btn ghost small" id="leave">Leave</button>`}`)+`
  <section class="lobby">
    <div class="panel">
      <div class="bigcode"><h3>Room code</h3><div class="c">${esc(code)}</div><p class="hint">Send friends the link, or they open this page and type the code.</p><div class="invite"><input id="inv" readonly value="${esc(inviteLink())}" aria-label="Invite link"><button class="btn small" id="copy">${ui.copied?"Copied":"Share link"}</button></div></div>
      <h3>Players · ${n} of 14</h3>
      <ul class="plist">${ids.map((u,i)=>`<li style="--pc:${COLORS[i%COLORS.length]}"><span class="dot"></span>
        <span class="n">${esc(P[u].name||"Player")}${u===me.id?"<small>you</small>":""}${u===R.hostId?"<small>host</small>":""}<small>${(P[u].picks||[]).length} picks</small></span>
        ${isHost&&u!==me.id?`<button class="btn ghost small" data-rm="${esc(u)}">Remove</button>`:"<span></span>"}</li>`).join("")||`<li><span></span><span class="hint">Nobody yet. Share the code.</span><span></span></li>`}</ul>
      ${isHost?`
        <div class="settings">
          <label>Seconds each<select id="secs">${[20,30,45].map(v=>`<option value="${v}" ${v==R.settings.secs?"selected":""}>${v} s</option>`).join("")}</select></label>
          <label>Wrong answer costs<select id="pen">${[2,3,5].map(v=>`<option value="${v}" ${v==R.settings.penalty?"selected":""}>${v} s</option>`).join("")}</select></label>
          <label>Loser gives up<select id="mode"><option value="one" ${R.settings.mode!=="all"?"selected":""}>one tile</option><option value="all" ${R.settings.mode==="all"?"selected":""}>all tiles (show rules)</option></select></label>
        </div>
        <button id="start" class="btn primary big" ${n<2||n>14?"disabled":""}>Start the game</button>
        <p class="hint">${n<2?"You need at least 2 players.":`With ${n} players everyone gets ${k} tile${k>1?"s":""}. Missing picks are filled at random.`}</p>`
      :`<p class="hint">Waiting for the host to start. With ${n} players everyone gets ${k} tile${k>1?"s":""}.</p>`}
      <p class="msg">${esc(ui.msg)}</p>
    </div>
    ${P[me.id]?`<div class="panel">
      <h2>Your categories</h2>
      <p class="hint">Tap up to ${MAX_PICKS} favourites in order. Your top ${k} go on the floor (first come, first served if two people pick the same one).</p>
      ${Object.entries(CATS).map(([g,list])=>`<div class="cgroup"><h3>${esc(g)}</h3><div class="chips">${list.filter(c=>ALL.includes(c)).map(c=>{
        const r=mine.indexOf(c);return `<button class="chip ${r>=0?"on":""} ${r<0&&taken.has(c)?"taken":""}" data-c="${esc(c)}">${r>=0?`<span class="rk">${r+1}</span>`:""}${esc(c)}</button>`}).join("")}</div></div>`).join("")}
    </div>`:`<div class="panel"><h2>${isHost?"Host screen":"Watching"}</h2><p class="hint">${isHost?"This device runs the game. Keep this page open and the screen on until the game ends.":"The game is already set up. You’re watching from this device."}</p></div>`}
  </section>`;
  bind("leave",leaveRoom); bind("end",endRoom); bind("start",hostStart); bind("copy",copyInvite);
  bind("secs",e=>hostSetting("secs",+e.target.value),"change");
  bind("pen",e=>hostSetting("penalty",+e.target.value),"change");
  bind("mode",e=>hostSetting("mode",e.target.value),"change");
  app.querySelectorAll("[data-rm]").forEach(b=>b.addEventListener("click",()=>hostRemove(b.dataset.rm)));
  app.querySelectorAll(".chip[data-c]").forEach(b=>b.addEventListener("click",()=>togglePick(b.dataset.c)));
}

function statusHTML(){
  if(R.phase==="over") return `<span style="--pc:${colorOf(R.winner)}"><b>${esc(nameOf(R.winner))}</b> owns the floor</span>`;
  if(ui.spinning) return `Spinning…`;
  if(R.claim) return R.claim.by===me.id?`<span style="--pc:${colorOf(me.id)}"><b>You won!</b> Tap which of ${esc(nameOf(R.claim.from))}’s tiles you take</span>`
    :`<span style="--pc:${colorOf(R.claim.by)}"><b>${esc(nameOf(R.claim.by))}</b> is picking a tile to take</span>`;
  if(R.challenger) return R.challenger===me.id?`<span style="--pc:${colorOf(me.id)}"><b>You’re up!</b> Tap a flashing tile to challenge</span>`
    :`<span style="--pc:${colorOf(R.challenger)}"><b>${esc(nameOf(R.challenger))}</b> is choosing who to challenge</span>`;
  if(R.phase==="duel") return `Duel in progress`;
  return isHost?`Spin the randomizer to pick the next challenger`:`Waiting for the host to spin`;
}
function renderBoard(){
  const meUp=!ui.spinning&&R.phase==="board"&&!R.claim&&R.challenger===me.id;
  const tg=meUp?targets(R,me.id):new Set(); const chal=ui.spinning?null:R.challenger;
  const claimSet=new Set(R.claim&&R.claim.by===me.id?R.claim.options:[]);
  const al=new Set(alive(R));
  const ord=R.players.slice().sort((a,b)=>count(b)-count(a));
  const tiles=R.tiles.map((t,i)=>{
    if(!t) return `<div class="tile empty" aria-hidden="true"></div>`;
    let cls="tile";
    if(ui.spinning){cls+=t.o===ui.spinLit?" lit":" dim"}
    else if(R.claim){cls+=claimSet.has(i)?" target":R.claim.options.includes(i)?"":" dim"}
    else if(chal&&R.phase==="board"){cls+=t.o===chal?" mine":tg.has(i)?" target":targets(R,chal).has(i)?"":" dim"}
    const click=cls.includes("target");
    return `<button class="${cls}" data-i="${i}" style="--pc:${colorOf(t.o)}" ${click?"":`tabindex="-1"`} aria-label="${label(i)}, ${esc(nameOf(t.o))}, ${esc(t.c)}">
      <span class="meta">${label(i)}</span><span class="who">${esc(nameOf(t.o))}</span><span class="cat">${esc(t.c)}</span></button>`;
  }).join("");
  app.innerHTML=header(`<span class="codechip">${esc(code)}</span>
      ${isHost?`<button class="btn ghost small" id="end">Close room</button>`:`<button class="btn ghost small" id="leave">Leave</button>`}`)+`
  <main class="stage">
    <div class="boardwrap">
      <div class="status">${statusHTML()}</div>
      <div class="board" id="board">${tiles}</div>
      ${R.phase==="over"
        ?`<div class="over" style="--pc:${colorOf(R.winner)}"><div class="big">${esc(nameOf(R.winner))} wins</div><p class="hint">${R.log.length} duels played.</p>${isHost?`<button id="again" class="btn primary big">Back to the lobby</button>`:`<p class="hint">The host can start a new round.</p>`}</div>`
        :isHost?`<div class="ctrl"><button id="spin" class="btn primary big" ${R.phase!=="board"||R.claim||ui.spinning||(R.spin&&R.spin.pendingAt)?"disabled":""}>Spin the randomizer</button>
           <span class="hint">Or tap a name to choose the challenger yourself.</span></div>`:""}
      <p class="msg">${esc(ui.msg)}</p>
    </div>
    <aside class="side">
      <h3>Standings · tiles</h3>
      <ol class="stand">${ord.map(u=>`<li data-p="${esc(u)}" style="--pc:${colorOf(u)}" class="${al.has(u)?"":"out"} ${R.challenger===u&&!ui.spinning?"now":""} ${isHost&&al.has(u)&&R.phase==="board"?"pickable":""}">
        <span class="dot"></span><span class="n">${esc(nameOf(u))}${u===me.id?" (you)":""}</span><span class="c">${count(u)}</span></li>`).join("")}</ol>
      <h3>Duel log</h3>
      <ol class="log">${R.log.map(l=>`<li><span class="w" style="--pc:${colorOf(l.w)}">${esc(nameOf(l.w))}</span> beat ${esc(nameOf(l.l))} on <b>${esc(l.cat)}</b></li>`).join("")||"<li>No duels yet</li>"}</ol>
    </aside>
  </main>`;
  bind("leave",leaveRoom); bind("end",endRoom); bind("spin",hostSpin); bind("again",hostToLobby);
  document.getElementById("board").addEventListener("click",e=>{
    const el=e.target.closest(".tile.target"); if(!el) return; const i=+el.dataset.i;
    if(R.claim&&R.claim.by===me.id) act("claim",{tile:i}); else if(meUp) act("challenge",{tile:i});
  });
  if(isHost) app.querySelectorAll(".stand li.pickable").forEach(li=>li.addEventListener("click",()=>hostPickChallenger(li.dataset.p)));
}

/* ---------- duel ---------- */
function removeDuel(){const d=document.getElementById("duel");if(d)d.remove();const r=document.getElementById("dres");if(r)r.remove()}
function clockVal(s){const d=R.duel;let v=d.clock[s];if(s===d.active&&(d.state==="live"||d.state==="penalty"))v-=(Date.now()-recvAt)/1000;return Math.max(0,v)}
function renderDuel(){
  const d=R.duel; const mySide=side(d,me.id); const myTurn=mySide&&d.active===mySide;
  let el=document.getElementById("duel"); if(!el){el=document.createElement("div");el.id="duel";el.className="duel";document.body.appendChild(el)}
  const isEmoji=[...d.q.clue].length<=4;
  let screen;
  if(d.state==="countdown") screen=`<div class="count" id="count">3</div>`;
  else screen=`<div class="clue ${isEmoji?"emoji":""}">${esc(d.q.clue)}</div>`;
  let fb="",fbCls="";
  if(d.last){const who=esc(nameOf(d.last.by==="a"?d.att:d.def));
    if(d.last.ok){fb=`✓ ${who}: ${esc(d.last.ans)}`;fbCls="ok"}
    else{fb=d.last.pick?`✗ ${who} picked ${esc(d.last.pick)}. It was ${esc(d.last.ans)}`:`${who} passed. It was ${esc(d.last.ans)}`;fbCls="bad"}}
  if(d.state==="countdown") {fb=`${esc(nameOf(d.def))} answers first`;fbCls=""}
  let answers;
  if(myTurn&&(d.state==="live"||d.state==="penalty")){
    const locked=d.state!=="live"||ui.lockQn===d.qn;
    answers=`<div class="answers">${d.q.options.map(o=>`<button class="opt" data-o="${esc(o)}" ${locked?"disabled":""}>${esc(o)}</button>`).join("")}</div>
      <div class="passrow"><button class="btn ghost" id="pass" ${locked?"disabled":""}>Pass (costs ${R.settings.penalty} s)</button></div>`;
  }else if(mySide&&d.state==="countdown"){
    answers=`<p class="waiting">${mySide==="d"?"You answer first. Get ready!":"Your opponent answers first. Get ready!"}</p>`;
  }else{
    const who=d.active==="a"?d.att:d.def;
    answers=d.state==="done"?"":`<p class="waiting">${mySide?"Your opponent is answering…":`${esc(nameOf(who))} is answering`}</p>`;
  }
  el.innerHTML=`<div class="dinner">
    <div class="dhead"><div class="eyebrow">Duel for tile ${label(d.idx)}</div><h1>${esc(d.cat)}</h1></div>
    <div class="clocks">
      <div class="pl ${d.active==="a"&&d.state!=="countdown"?"on":""}" style="--pc:${colorOf(d.att)}"><div class="role">Challenger</div><div class="nm">${esc(nameOf(d.att))}${mySide==="a"?" (you)":""}</div><div class="clk" data-s="a"></div></div>
      <div class="pl ${d.active==="d"&&d.state!=="countdown"?"on":""}" style="--pc:${colorOf(d.def)}"><div class="role">Defender</div><div class="nm">${esc(nameOf(d.def))}${mySide==="d"?" (you)":""}</div><div class="clk" data-s="d"></div></div>
    </div>
    <div class="screen">${screen}</div>
    <div class="feedback ${fbCls}">${fb}</div>
    ${answers}
  </div>`;
  el.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{ui.lockQn=d.qn;act("answer",{qn:d.qn,pick:b.dataset.o});el.querySelectorAll(".opt,#pass").forEach(x=>x.disabled=true)}));
  const ps=el.querySelector("#pass"); if(ps) ps.addEventListener("click",()=>{ui.lockQn=d.qn;act("answer",{qn:d.qn,pick:null});el.querySelectorAll(".opt,#pass").forEach(x=>x.disabled=true)});
  let r=document.getElementById("dres");
  if(d.state==="done"){
    const w=d.winner==="a"?d.att:d.def, l=d.winner==="a"?d.def:d.att;
    const what=R.settings.mode==="all"?`${esc(nameOf(l))} is out and ${esc(nameOf(w))} takes all their tiles.`
      :d.winner==="a"?`${esc(nameOf(w))} takes tile ${label(d.idx)}.`:`${esc(nameOf(w))} keeps ${label(d.idx)} and takes one of ${esc(nameOf(l))}’s tiles.`;
    if(!r){r=document.createElement("div");r.id="dres";r.className="dres";document.body.appendChild(r)}
    r.innerHTML=`<div class="card" style="--pc:${colorOf(w)}"><p class="hint">Time ran out for ${esc(nameOf(l))}</p><div class="w">${esc(nameOf(w))} wins</div><p class="hint">${what} Back to the floor in a moment.</p></div>`;
  }else if(r) r.remove();
  tickClocks();
}
function tickClocks(){
  if(!R||R.phase!=="duel"||!R.duel) return; const d=R.duel;
  document.querySelectorAll("#duel .clk").forEach(c=>{const v=clockVal(c.dataset.s);c.textContent=v>=10?Math.ceil(v):v.toFixed(1);c.classList.toggle("low",v<10)});
  const cnt=document.getElementById("count"); if(cnt&&d.state==="countdown") cnt.textContent=Math.max(1,Math.ceil(3-(Date.now()-recvAt)/1000));
}
setInterval(tickClocks,100);

boot();
</script>
